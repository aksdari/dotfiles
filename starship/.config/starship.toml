"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](surface0)\
$directory\
[](fg:surface0 bg:overlay0)\
$git_branch$git_status\
[](fg:overlay0 bg:surface1)\
$nodejs$golang$python$rust$docker_context\
[](fg:surface1)\
$cmd_duration\
$line_break\
$character"""

add_newline = true
command_timeout = 500

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext0 = "#a6adc8"
overlay0 = "#6c7086"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
crust = "#11111b"

palette = "catppuccin_mocha"

[directory]
style = "fg:text bg:surface0"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"
read_only = " "

[directory.substitutions]
"Documents" = "󰈙"
"Downloads" = " "
"github" = " "
".config" = " "

[git_branch]
symbol = ""
style = "fg:base bg:overlay0"
format = "[ $symbol $branch ]($style)"

[git_status]
style = "fg:base bg:overlay0"
format = "[$all_status$ahead_behind]($style)"
conflicted = "= "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
untracked = "? "
stashed = " "
modified = "! "
staged = "+ "
renamed = "» "
deleted = "✘ "

[nodejs]
symbol = ""
style = "fg:text bg:surface1"
format = "[ $symbol ($version) ]($style)"

[golang]
symbol = ""
style = "fg:text bg:surface1"
format = "[ $symbol ($version) ]($style)"

[python]
symbol = ""
style = "fg:text bg:surface1"
format = "[ $symbol ($version) ]($style)"

[rust]
symbol = ""
style = "fg:text bg:surface1"
format = "[ $symbol ($version) ]($style)"

[docker_context]
symbol = " "
style = "fg:text bg:surface1"
format = "[ $symbol $context ]($style)"
only_with_files = true

[cmd_duration]
min_time = 2000
style = "fg:yellow"
format = " [ $duration]($style)"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold green)"
